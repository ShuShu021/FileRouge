<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExploMonde</title>
    <link rel="stylesheet" href="/CSS/token.css" />
    <link rel="stylesheet" href="/CSS/base.css" />
    <link rel="stylesheet" href="/CSS/componant.css" />
  </head>
  <body>
    <header>
      <h1>ExploMonde</h1>
      <nav>
        <ul>
          <li><a href="#main-content">Aller au contenu principal</a></li>
          <li><a href="#accueil">Accueil</a></li>
          <li><a href="#recherche">Recherche</a></li>
          <li><a href="#resultats">Résultats</a></li>
        </ul>
      </nav>
    </header>

    <main id="main-content">
      <section id="recherche">
        <h2>Rechercher un pays</h2>
        <form>
          <label for="pays">Nom du pays</label>
          <input type="text" id="pays" name="pays" placeholder="Ex : France" />
          <button type="submit">Rechercher</button>
        </form>

        <label for="filtre-region">Filtrer par région</label>
        <select id="filtre-region">
          <option value="toutes">Toutes les régions</option>
          <option value="Europe">Europe</option>
          <option value="Asie">Asie</option>
          <option value="Amérique du Nord">Amérique du Nord</option>
          <option value="Amérique du Sud">Amérique du Sud</option>
          <option value="Afrique">Afrique</option>
          <option value="Océanie">Océanie</option>
        </select>
      </section>

      <section id="resultats">
        <h2>Résultats</h2>

        <p role="status">Pays affichés :</p>
      </section>

      <section id="detail-section">
        <h2>Détail</h2>
        <p id="detail">Clique sur le nom du pays pour voir son détail.</p>
      </section>
    </main>

    <script type="module" src="/JS/main.js"></script>
  </body>
</html>
